<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .blog-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 28px;
      align-items: start;
    }

    .posts {
      display: grid;
      gap: 14px;
    }

    .post,
    .post-form {
      padding: 18px;
      border: 1px solid var(--study-border);
      background: var(--study-surface);
    }

    .post h2 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -.04em;
    }

    .post-description {
      margin: 0 0 14px;
      color: var(--study-text);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0;
      color: var(--study-muted);
      font-size: 11px;
    }

    .post-keyword {
      padding: 3px 7px;
      border: 1px solid var(--study-border);
      color: var(--study-text);
    }

    .post-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--study-text);
      font-size: 12px;
      text-underline-offset: 3px;
    }

    .post-form {
      position: sticky;
      top: 20px;
    }

    .post-form h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .post-form label {
      display: block;
      margin: 12px 0 5px;
      color: var(--study-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .post-form input,
    .post-form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--study-border);
      border-radius: 0;
      background: var(--study-input);
      color: var(--study-text);
      font: 13px/1.5 Arial, Helvetica, sans-serif;
    }

    .post-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .post-form .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .post-form button {
      padding: 10px 12px;
      font-size: 11px;
    }

    .blog-status {
      min-height: 1.5em;
      margin: 10px 0 0;
      color: var(--study-muted);
      font-size: 11px;
    }

    .empty-posts {
      padding: 18px;
      border: 1px solid var(--study-border);
      color: var(--study-muted);
    }

    @media (max-width: 760px) {
      .blog-layout { grid-template-columns: 1fr; }
      .post-form { position: static; order: -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Blog</h1>
      <p class="intro">Uma coleção de textos, referências e ideias. Adicione novos posts manualmente pelo formulário.</p>
    </header>

    <div class="blog-layout">
      <section>
        <div id="posts" class="posts" aria-live="polite"></div>
      </section>

      <aside class="post-form">
        <h2>Adicionar post</h2>
        <form id="postForm">
          <label for="postTitle">Título</label>
          <input id="postTitle" required>

          <label for="postDescription">Descrição</label>
          <textarea id="postDescription" required></textarea>

          <label for="postLink">Link</label>
          <input id="postLink" type="url" placeholder="https://..." required>

          <label for="postKeywords">3 palavras-chave</label>
          <input id="postKeywords" placeholder="ex.: design, escrita, web" required>
          <p class="note">Separe as três palavras-chave por vírgula.</p>

          <div class="buttons">
            <button type="submit">Adicionar post</button>
            <button id="clearPosts" class="secondary" type="button">Restaurar início</button>
          </div>
          <p id="blogStatus" class="blog-status" role="status"></p>
        </form>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const storageKey = "arquivo-blog-posts-v1";
      const initialPost = {
        title: "Sobre este blog",
        description: "Esta é a página de blog do arquivo. Ela foi criada para reunir novos textos, referências e ideias em um só lugar. Use o formulário ao lado para adicionar manualmente outros posts.",
        link: window.location.href,
        keywords: ["blog", "arquivo", "ideias"]
      };
      const postsElement = document.getElementById("posts");
      const form = document.getElementById("postForm");
      const status = document.getElementById("blogStatus");

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[character]));
      }

      function getPosts() {
        try {
          const saved = JSON.parse(window.localStorage.getItem(storageKey) || "null");
          return Array.isArray(saved) && saved.length ? saved : [initialPost];
        } catch {
          return [initialPost];
        }
      }

      function savePosts(posts) {
        window.localStorage.setItem(storageKey, JSON.stringify(posts));
      }

      function renderPosts() {
        const posts = getPosts();
        postsElement.innerHTML = posts.map(post => `
          <article class="post">
            <h2>${escapeHtml(post.title)}</h2>
            <p class="post-description">${escapeHtml(post.description)}</p>
            <p class="post-meta">
              ${post.keywords.map(keyword => `<span class="post-keyword">${escapeHtml(keyword)}</span>`).join("")}
            </p>
            <a class="post-link" href="${escapeHtml(post.link)}" target="_blank" rel="noopener noreferrer">Abrir post</a>
          </article>
        `).join("");
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const keywords = document.getElementById("postKeywords").value
          .split(",")
          .map(keyword => keyword.trim())
          .filter(Boolean);
        if (keywords.length !== 3) {
          status.textContent = "Informe exatamente 3 palavras-chave, separadas por vírgulas.";
          return;
        }
        const link = document.getElementById("postLink").value.trim();
        let parsedLink;
        try {
          parsedLink = new URL(link);
        } catch {
          status.textContent = "Informe um link válido.";
          return;
        }
        if (parsedLink.protocol !== "http:" && parsedLink.protocol !== "https:") {
          status.textContent = "Use um link começando com http:// ou https://.";
          return;
        }
        const post = {
          title: document.getElementById("postTitle").value.trim(),
          description: document.getElementById("postDescription").value.trim(),
          link,
          keywords
        };
        const posts = getPosts();
        posts.push(post);
        savePosts(posts);
        renderPosts();
        form.reset();
        status.textContent = "Post adicionado.";
      });

      document.getElementById("clearPosts").addEventListener("click", () => {
        savePosts([initialPost]);
        renderPosts();
        status.textContent = "Página inicial restaurada.";
      });

      renderPosts();
    })();
  </script>
</body>
</html>
