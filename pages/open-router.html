<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter — Prompts</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2e;
      --line: #263451;
      --text: #edf2ff;
      --muted: #a7b4cf;
      --accent: #8b9cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #172443 0, var(--bg) 55%);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }

    main { max-width: 1180px; margin: 0 auto; padding: 28px 18px 40px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.12; }
    p { color: var(--muted); }

    .shared-config {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(240px, 1fr);
      gap: 14px;
      margin: 22px 0 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 26, 46, .92);
    }

    .field { display: block; min-width: 0; }
    .field span { display: block; margin-bottom: 6px; font-size: .85rem; font-weight: 650; }
    input, textarea {
      width: 100%;
      border: 1px solid #344362;
      border-radius: 10px;
      background: #0b1224;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #8b9cff22; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      padding: 10px 14px;
      background: #17213a;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--accent); color: #10152b; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .frame {
      width: 100%;
      height: 75vh;
      min-height: 620px;
      border: 1px solid var(--line);
      border-top: 0;
      background: var(--bg);
    }

    .simple-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      padding-top: 18px;
    }
    .panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 26, 46, .92);
    }
    h2 { margin: 0 0 14px; font-size: 1.05rem; }
    textarea { min-height: 310px; resize: vertical; }
    button, .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--accent);
      color: #10152b;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .status { min-height: 24px; white-space: pre-wrap; color: var(--muted); }
    .output {
      min-height: 310px;
      max-height: 60vh;
      overflow: auto;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      background: #0b1224;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .shared-config, .simple-layout { grid-template-columns: 1fr; }
      .frame { min-height: 760px; }
    }
  </style>
  <link rel="stylesheet" href="../theme.css">
  <style>
    body {
      background: var(--study-bg);
      color: var(--study-text);
      font: 13px/1.55 Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1080px;
      padding: 0;
    }

    main > h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 400;
      letter-spacing: -.07em;
      line-height: .95;
    }

    main > p {
      max-width: 390px;
      margin: 10px 0 22px;
      font-size: 12px;
    }

    .shared-config {
      grid-template-columns: minmax(180px, 1fr) minmax(240px, 1fr);
      margin: 0 0 18px;
      padding: 20px;
      border-color: var(--study-border);
      border-radius: 0;
      background: var(--study-surface);
    }

    .field span {
      color: var(--study-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .shared-config input,
    .simple-layout textarea {
      border-color: var(--study-border);
      border-radius: 0;
      background: var(--study-input);
      color: var(--study-text);
      font: 14px/1.55 Arial, Helvetica, sans-serif;
    }

    .tabs {
      gap: 0;
      border-color: var(--study-border);
    }

    .tab {
      border-color: var(--study-border);
      border-radius: 0;
      padding: 10px 14px;
      background: var(--study-surface);
      color: var(--study-text);
      font: 11px Arial, Helvetica, sans-serif;
      font-weight: 700;
    }

    .tab[aria-selected="true"] {
      background: #ffffff;
      color: #111111;
      box-shadow: inset 0 -4px 0 #777777;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .tab[aria-selected="true"]::after {
      content: "•";
      display: inline-block;
      margin-left: 7px;
      color: currentColor;
      font-size: 15px;
      line-height: 0;
      vertical-align: -1px;
    }

    .frame {
      border-color: var(--study-border);
      background: var(--study-bg);
    }

    .simple-layout {
      gap: 14px;
      padding-top: 14px;
    }

    .simple-layout .panel {
      padding: 20px;
      border-color: var(--study-border);
      border-radius: 0;
      background: var(--study-surface);
      box-shadow: none;
    }

    .simple-layout h2 {
      color: var(--study-text);
      font-size: 16px;
    }

    .simple-layout button {
      border: 1px solid var(--study-accent);
      border-radius: 0;
      background: var(--study-accent);
      color: var(--study-bg);
      font: 11px Arial, Helvetica, sans-serif;
      font-weight: 700;
    }

    .simple-layout .status {
      color: var(--study-muted);
    }

    .output {
      border-color: var(--study-border);
      border-radius: 0;
      background: var(--study-input);
      color: var(--study-text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Prompts OpenRouter</h1>
    <p>Escolha uma ferramenta. A chave e o modelo ficam disponíveis para todas as abas.</p>

    <div class="shared-config">
      <label class="field" for="sharedKey"><span>Chave da API OpenRouter</span><input id="sharedKey" type="password" placeholder="sk-or-v1-..." autocomplete="off"></label>
      <label class="field" for="sharedModel"><span>Modelo OpenRouter</span><input id="sharedModel" list="model-options" value="google/gemini-2.5-flash" autocomplete="off"></label>
      <datalist id="model-options">
        <option value="google/gemini-2.5-flash">
        <option value="google/gemini-2.5-pro">
        <option value="google/gemini-2.5-flash-image-preview">
        <option value="openai/gpt-4o-mini">
        <option value="openai/gpt-5-image">
        <option value="qwen/qwen-image-2.1-turbo">
        <option value="black-forest-labs/flux.2-klein-4b">
      </datalist>
    </div>

    <div class="tabs" role="tablist" aria-label="Ferramentas OpenRouter">
      <button class="tab" id="tab-simple" role="tab" aria-selected="true" aria-controls="panel-simple">Prompt simples</button>
      <button class="tab" id="tab-pdf" role="tab" aria-selected="false" aria-controls="panel-pdf">Prompt PDF</button>
      <button class="tab" id="tab-image" role="tab" aria-selected="false" aria-controls="panel-image">Prompt image</button>
      <button class="tab" id="tab-jev" role="tab" aria-selected="false" aria-controls="panel-jev">Prompt JEV</button>
    </div>

    <section class="tab-panel active" id="panel-simple" role="tabpanel" aria-labelledby="tab-simple">
      <div class="simple-layout">
        <section class="panel">
          <h2>Prompt</h2>
          <textarea id="simplePrompt" placeholder="Escreva o prompt que deseja enviar..."></textarea>
          <div class="buttons"><button id="simpleRun" type="button">Enviar prompt</button></div>
          <p class="status" id="simpleStatus" role="status"></p>
        </section>
        <section class="panel">
          <h2>Resposta</h2>
          <pre class="output" id="simpleOutput"></pre>
        </section>
      </div>
    </section>
    <section class="tab-panel" id="panel-pdf" role="tabpanel" aria-labelledby="tab-pdf">
      <iframe class="frame" title="Prompt PDF" src="open-router-pdf.html"></iframe>
    </section>
    <section class="tab-panel" id="panel-image" role="tabpanel" aria-labelledby="tab-image">
      <iframe class="frame" title="Prompt image" src="open-router-img.html"></iframe>
    </section>
    <section class="tab-panel" id="panel-jev" role="tabpanel" aria-labelledby="tab-jev">
      <iframe class="frame" title="Prompt JEV" src="open-router-jev.html"></iframe>
    </section>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const sharedKey = $("sharedKey");
      const sharedModel = $("sharedModel");
      const frames = Array.from(document.querySelectorAll(".frame"));

      function setFrameModel(frame, value) {
        const documentRoot = frame.contentDocument;
        if (!documentRoot) return;
        const model = documentRoot.getElementById("openrouterModel") || documentRoot.getElementById("model");
        if (!model) return;
        if (model.tagName === "SELECT" && value && !Array.from(model.options).some(option => option.value === value)) {
          model.appendChild(new Option(value, value));
        }
        model.value = value;
        model.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function hideInternalConfig(frame) {
        const documentRoot = frame.contentDocument;
        if (!documentRoot) return;
        const key = documentRoot.getElementById("apiKey") || documentRoot.getElementById("openrouterKey");
        const model = documentRoot.getElementById("openrouterModel") || documentRoot.getElementById("model");
        [key, model].forEach(field => {
          if (!field) return;
          const label = documentRoot.querySelector(`label[for="${field.id}"]`);
          if (label) label.style.display = "none";
          field.style.display = "none";
        });
        if (key && key.parentElement) {
          const notice = key.parentElement.querySelector(".security-notice");
          if (notice) notice.style.display = "none";
        }
      }

      function syncFrame(frame) {
        const documentRoot = frame.contentDocument;
        if (!documentRoot) return;
        const key = documentRoot.getElementById("apiKey") || documentRoot.getElementById("openrouterKey");
        if (key) key.value = sharedKey.value;
        setFrameModel(frame, sharedModel.value.trim());
        hideInternalConfig(frame);
      }

      frames.forEach(frame => frame.addEventListener("load", () => syncFrame(frame)));
      [sharedKey, sharedModel].forEach(input => input.addEventListener("input", () => frames.forEach(syncFrame)));

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(item => item.setAttribute("aria-selected", String(item === tab)));
          document.querySelectorAll(".tab-panel").forEach(panel => panel.classList.toggle("active", panel.id === tab.getAttribute("aria-controls")));
          frames.forEach(syncFrame);
        });
      });

      $("simpleRun").addEventListener("click", async () => {
        const key = sharedKey.value.trim();
        const model = sharedModel.value.trim();
        const prompt = $("simplePrompt").value.trim();
        const status = $("simpleStatus");
        const output = $("simpleOutput");
        if (!key) { status.textContent = "Informe sua chave da API OpenRouter."; return; }
        if (!model) { status.textContent = "Informe o ID do modelo."; return; }
        if (!prompt) { status.textContent = "Escreva o prompt."; return; }
        $("simpleRun").disabled = true;
        status.textContent = "Enviando...";
        output.textContent = "";
        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }] })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data?.error?.message || `A API respondeu com HTTP ${response.status}.`);
          const content = data?.choices?.[0]?.message?.content;
          output.textContent = Array.isArray(content) ? content.map(item => item?.text || "").join("") : content || JSON.stringify(data, null, 2);
          status.textContent = "Resposta recebida.";
        } catch (error) {
          status.textContent = `Erro: ${error.message}`;
        } finally {
          $("simpleRun").disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
