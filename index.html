<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquivo editorial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="access-modal" id="access-modal">
    <form class="access-box" id="access-form">
      <h1>Validação de acesso</h1>
      <p>Responda à pergunta para continuar.</p>
      <label for="access-answer">Qual meu apelido?</label>
      <input id="access-answer" type="text" autocomplete="off" autofocus>
      <div class="access-error" id="access-error" role="alert"></div>
      <button type="submit">Continuar</button>
    </form>
  </div>

  <div class="site-shell">
  <header class="mobile-topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menu"
      aria-expanded="false" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-title" id="mobile-title">arquivo</span>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="Navegação de páginas">
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator"
      aria-label="Redimensionar sidebar" aria-orientation="vertical"
      tabindex="0"></div>
    <div class="sidebar-header">
      <a class="brand" href="index.html" aria-label="Início">arquivo</a>
      <button class="sidebar-collapse" id="sidebar-collapse" type="button"
        aria-label="Esconder sidebar" aria-controls="sidebar" aria-expanded="true">
        ‹
      </button>
    </div>
    <nav id="page-navigation">
      <p class="nav-heading">páginas</p>
      <div id="page-list" class="page-list" aria-live="polite"></div>
    </nav>
    <div class="sidebar-bottom">
      <button class="text-storage-button" id="open-text-storage" type="button"
        aria-haspopup="dialog" aria-controls="text-storage-modal">
        Texto salvo
      </button>
      <p class="sidebar-footer">coleção<br>2026</p>
    </div>
  </aside>
  <button class="sidebar-reveal" id="sidebar-reveal" type="button"
    aria-label="Mostrar sidebar" aria-controls="sidebar" hidden>
    ›
  </button>

  <main class="content">
    <iframe id="page-frame" title="Página selecionada"></iframe>
    <p id="empty-state" class="empty-state" hidden>Nenhuma página HTML foi encontrada.</p>
  </main>
  </div>

  <div class="text-storage-modal" id="text-storage-modal" role="dialog"
    aria-modal="true" aria-labelledby="text-storage-title" hidden>
    <div class="text-storage-box">
      <div class="text-storage-header">
        <h2 id="text-storage-title">Texto local</h2>
        <button class="text-storage-close" id="close-text-storage" type="button"
          aria-label="Fechar">×</button>
      </div>
      <label for="stored-text">Cole aqui o texto que deseja guardar neste navegador</label>
      <textarea id="stored-text" rows="12" spellcheck="false"
        placeholder="Texto, chave, JWT ou outro conteúdo..."></textarea>
      <p class="text-storage-status" id="text-storage-status" aria-live="polite"></p>
      <div class="text-storage-actions">
        <button type="button" id="copy-stored-text">Copiar</button>
        <button type="button" id="save-stored-text">Salvar / atualizar</button>
        <button type="button" id="delete-stored-text" class="delete">Apagar</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var authStorageKey = "arquivo-root-auth-v1";
      var authDuration = 24 * 60 * 60 * 1000;
      var expectedAnswer = "desenhocasinha";
      var modal = document.getElementById("access-modal");
      var form = document.getElementById("access-form");
      var input = document.getElementById("access-answer");
      var error = document.getElementById("access-error");

      function isAuthenticated() {
        var saved = Number(window.localStorage.getItem(authStorageKey));
        return Number.isFinite(saved) && saved > 0 && Date.now() - saved < authDuration;
      }

      function grantAccess() {
        window.localStorage.setItem(authStorageKey, String(Date.now()));
        window.location.reload();
      }

      if (isAuthenticated()) {
        modal.remove();
        document.body.classList.add("access-granted");
      } else {
        window.localStorage.removeItem(authStorageKey);
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var answer = input.value.trim().toLocaleLowerCase("pt-BR");
          if (answer !== expectedAnswer) {
            error.textContent = "Resposta incorreta. Tente novamente.";
            input.select();
            return;
          }
          grantAccess();
        });
      }
    }());
  </script>
  <script src="manifest.js?v=20261023"></script>
  <script src="app.js"></script>
</body>
</html>
